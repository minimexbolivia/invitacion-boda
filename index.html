<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Boda</title>

    <style>
        body {
            margin: 0;
            font-family: "Georgia", serif;
            background: #faf6f1;
            text-align: center;
        }

        /* ----- PORTADA ----- */
        #portada {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #portada img {
            width: 85%;
            max-width: 420px;
            border-radius: 15px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.20);
        }

        #portada button {
            margin-top: 25px;
            font-size: 1.3rem;
            background: #c49b66;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
        }

        #portada button:hover {
            background: #a9814f;
        }

        /* ----- CONTENIDO PRINCIPAL ----- */
        #contenido {
            display: none;
            padding: 20px;
        }

        .marco {
            border: 18px solid transparent;
            border-image: url("marco-floral.png.jpg") 30 round;
            padding: 25px;
            margin: 25px auto;
            max-width: 700px;
            background: white;
        }

        h1 {
            font-size: 2.7rem;
            margin-bottom: 0;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 5px;
            color: #6b4f35;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- ===================== PORTADA ===================== -->
    <div id="portada">
        <img src="portada.png.jpeg" alt="Portada Boda">
        <button id="btnEntrar">Entrar a la invitación</button>
    </div>

    <!-- Música que se reproducirá al entrar -->
    <audio id="musica" src="musica.mp3.mp3" preload="auto"></audio>

    <!-- ===================== CONTENIDO ===================== -->
    <div id="contenido">
        <div class="marco">
            <h1>Carlos & Lourdes</h1>
            <h2>¡Nos casamos!</h2>

            <p>Con gran alegría queremos invitarte a celebrar junto a nosotros este día tan especial.</p>

            <p><strong>📅 Fecha:</strong> 12 de Diciembre 2025<br>
               <strong>⏰ Hora:</strong> 19:30<br>
               <strong>📍 Lugar:</strong> Salón de eventos “Los Álamos”</p>

            <p>Será un honor contar con tu presencia para compartir este momento único.</p>
        </div>
    </div>

    <!-- ===================== SCRIPT ===================== -->
    <script>
        const btn = document.getElementById("btnEntrar");
        const portada = document.getElementById("portada");
        const contenido = document.getElementById("contenido");
        const musica = document.getElementById("musica");

        btn.addEventListener("click", () => {
            portada.style.display = "none";
            contenido.style.display = "block";
            musica.play().catch(e => console.log("Autoplay bloqueado:", e));
        });
    </script>

</body>
</html>
